# ==========================================================
# 考研学习 Hub · 部署到 Cloudflare Pages + Functions（Advanced Mode）
#
# 部署步骤：
#   1) cd kaoyan  进入这个目录
#   2) 仅第一次：  npm install
#   3) 登录一次：  npm run login
#   4) 建 KV（首次）：npm run kv:create
#      把命令输出的 namespace id 填到下方 [[kv_namespaces]].id 处
#   5) 首次部署：npm run deploy
#      输出的 pages.dev 固定域名就是你永久链接（如 kaoyan-study-hub.pages.dev）
#   6) 打开 Cloudflare Dashboard → Pages → kaoyan-study-hub → 设置 → 环境变量
#      加以下变量（推荐，纯自用可不加）：
#        SYNC_TOKEN      = 32 位以上随机字符串
# ==========================================================
name = "kaoyan-study-hub"
compatibility_date = "2024-04-01"
compatibility_flags = [ "nodejs_compat" ]
pages_build_output_dir = "./"

[vars]
# 生产环境建议在 Cloudflare Dashboard 设置，不要写 CORS 通配
CORS_ORIGINS = "*"
KV_BINDING_NAME = "HUB_SYNC"

# [[kv_namespaces]]
#   binding = "HUB_SYNC"
#   id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
